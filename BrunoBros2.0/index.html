<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Rift</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Neon Rift">
      <canvas id="game" width="960" height="540" aria-label="Neon Rift"></canvas>

      <section class="hud" aria-live="polite">
        <div class="brand">
          <span class="brand-mark">NR</span>
          <span>Neon Rift</span>
        </div>
        <div class="hud-grid">
          <div class="meter">
            <span>HP</span>
            <i><b id="healthMeter"></b></i>
          </div>
          <div class="meter energy">
            <span>EN</span>
            <i><b id="energyMeter"></b></i>
          </div>
          <div class="counter"><span id="stageName">City</span></div>
          <div class="counter"><span id="score">0</span></div>
        </div>
      </section>

      <nav class="controls" aria-label="Controles">
        <button id="leftBtn" aria-label="Mover para esquerda">‹</button>
        <button id="jumpBtn" aria-label="Pular">⌃</button>
        <button id="rightBtn" aria-label="Mover para direita">›</button>
        <button id="attackBtn" aria-label="Ataque">⌁</button>
        <button id="shootBtn" aria-label="Atirar">•</button>
        <button id="dashBtn" aria-label="Dash energetico">⇢</button>
        <button id="powerBtn" aria-label="Explosao de energia">✦</button>
        <button id="restartBtn" aria-label="Reiniciar">↻</button>
      </nav>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
